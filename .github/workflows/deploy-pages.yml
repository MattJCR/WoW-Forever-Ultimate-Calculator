name: Desplegar en GitHub Pages

# Publica la web estatica (apps/web) en GitHub Pages en cada push a main.
# Requiere: Settings -> Pages -> Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @wfuc/web
      - run: npm run build -w @wfuc/web
        env:
          # Dirección pública: de ella salen la ruta base, el canonical, el hreflang y el sitemap. Con dominio propio, define la
          # variable SITE_URL del repositorio (Settings > Secrets and variables > Actions > Variables), p. ej. https://midominio.com
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
